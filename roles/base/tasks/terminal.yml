---

- name: Install terminal packages
  become: true
  ansible.builtin.dnf5:
    name:
      - atuin
      - bat
      - btop
      - fastfetch
      - fzf
      - cava
      - fish
      - kitty
      - tree
      - zsh
    state: present

- name: Install ghostty terminal
  become: true
  block:
    - name: Install ghostty terminal copr repo
      community.general.copr:
        host: copr.fedorainfracloud.org
        state: enabled
        name: scottames/ghostty

    - name: Install ghostty terminal
      ansible.builtin.dnf5:
        name: ghostty
        state: present

    - name: Copy ghostty terminal config
      ansible.posix.synchronize:
        src: "files/config/ghostty"
        dest: "{{ ansible_facts['user_dir'] }}/.config/"

# End of ghostty install block

- name: Install starship prompt
  become: true
  block:
    - name: Install starship copr repo
      become: true
      community.general.copr:
        host: copr.fedorainfracloud.org
        state: enabled
        name: atim/starship

    - name: Install starship
      become: true
      ansible.builtin.dnf5:
        name: starship
        state: present

# End of starship block

- name: Copy bash config
  ansible.builtin.copy:
    src: "files/bashrc"
    dest: "{{ ansible_facts['user_dir'] }}/.bashrc"
    mode: "0644"

- name: Copy fish config
  ansible.posix.synchronize:
    src: "files/config/fish"
    dest: "{{ ansible_facts['user_dir'] }}/.config/"

- name: Copy fastfetch config
  ansible.posix.synchronize:
    src: "files/config/fastfetch"
    dest: "{{ ansible_facts['user_dir'] }}/.config/"

- name: Copy ghostty terminal config
  ansible.posix.synchronize:
    src: "files/config/ghostty"
    dest: "{{ ansible_facts['user_dir'] }}/.config/"

- name: Copy kitty terminal config
  ansible.posix.synchronize:
    src: "files/config/kitty"
    dest: "{{ ansible_facts['user_dir'] }}/.config/"

- name: Change user shell
  block:
    - name: Get shell path
      ansible.builtin.command: which "{{ base_user_shell }}"
      register: shell_path
      changed_when: false

    - name: Make sure shell is located in /etc/shells
      become: true
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: "{{ shell_path.stdout }}"
        state: present

    - name: Set user shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: "{{ shell_path.stdout }}"

# End of change user shell block
