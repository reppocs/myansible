---

- name: install terminal packages
  become: true
  when: ansible_facts["os_family"] == "RedHat"
  ansible.builtin.dnf:
    name:
      - atuin
      - bat
      - btop
      - fastfetch
      - fzf
      - cava
      - fish
      - kitty
      - krita
      - tree
      - zsh
    state: present

- name: Install starship prompt Fedora
  become: true
  when: ansible_facts["os_family"] == "RedHat"
  block:
    - name: Install starship copr repo
      become: true
      community.general.copr:
        host: copr.fedorainfracloud.org
        state: enabled
        name: atim/starship

    - name: Install starship
      become: true
      ansible.builtin.dnf:
        name: starship
        state: present

# End of Fedora starship block

- name: Install starship prompt Ubuntu
  become: true
  community.general.snap:
    name: starship
    channel: edge
  when: ansible_facts["os_family"] == "Debian"

- name: Copy bash config
  ansible.builtin.copy:
    src: "files/bashrc"
    dest: "{{ ansible_facts['user_dir'] }}/.bashrc"
    mode: "0644"

- name: Copy fish config
  ansible.posix.synchronize:
    src: "files/config/fish"
    dest: "{{ ansible_facts['user_dir'] }}/.config/"

- name: Copy fastfetch config
  ansible.posix.synchronize:
    src: "files/config/fastfetch"
    dest: "{{ ansible_facts['user_dir'] }}/.config/"
