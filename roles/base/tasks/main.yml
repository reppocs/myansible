---

- name: Ensure that ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: '0755'

- name: Include packages task
  ansible.builtin.include_tasks: "packages.yml"

- name: Include development task
  ansible.builtin.include_tasks:
    file: "development.yml"
    apply:
      tags: dev
  tags: dev

- name: Include terminal task
  ansible.builtin.include_tasks:
    file: terminal.yml
    apply:
      tags: terminal
  tags: terminal

- name: Include desktop task
  ansible.builtin.include_tasks: "desktop.yml"
