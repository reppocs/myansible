---
- name: Install neovim
  become: true
  when: ansible_facts["distribution"] == "Fedora"
  ansible.builtin.dnf:
    name: neovim
    state: present

- name: Install neovim in ubuntu
  become: true
  when: ansible_facts["distribution"] == "Ubuntu"
  block:
    - name: Add the neovim ppa repo
      ansible.builtin.apt_repository:
        repo: "ppa:neovim-ppa/unstable"

    - name: Install neovim package
      ansible.builtin.apt:
        name: neovim
        state: present
        update_cache: true

# End of ubuntu neovim installation block

- name: Make sure nvim share directory is absent
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/nvim"
    state: absent

- name: Make sure nvim config directory is absent
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    state: absent

- name: Copy neovim config directory
  ansible.posix.synchronize:
    src: "files/nvim"
    dest: "{{ ansible_facts['user_dir'] }}/.config"
# EOF
