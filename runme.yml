---
- name: Install and configure local workstation
  hosts: localhost
  connection: local

  pre_tasks:
    - name: Fail if the distribution isn't supported
      ansible.builtin.fail:
        msg: This playbook is not compatible with your distribution.
      when: >
        (ansible_facts["distribution"] != "Ubuntu" and ansible_facts['distribution_version'] != "26.04") and
        (ansible_facts["distribution"] != "Fedora" and ansible_facts['distribution_major_version'] != "44")

  tasks:
    - name: Change the hostname if it's given
      ansible.builtin.hostname:
        name: "{{ hostname }}"
        use: systemd
      when: hostname is defined

  roles:
    - role: base
      tags:
        - base

    - role: neovim
      tags:
        - neovim

    - role: ssh
      tags:
        - ssh

    - role: git
      tags:
        - git

    - role: tailscale
      tags:
        - tailscale
      when: ansible_facts["virtualization_type"] != "wsl"

    - role: flatpak
      tags:
        - flatpak
      when: ansible_facts["virtualization_type"] != "wsl"

    - role: gnome
      tags:
        - gnome
        - never
      when: ansible_facts["virtualization_type"] != "wsl"

    - role: nvidia
      tags:
        - nvidia
        - never
