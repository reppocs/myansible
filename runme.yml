---
- name: Install and configure local workstation
  hosts: localhost
  connection: local

  pre_tasks:
    - name: Fail if the distribution isn't supported
      ansible.builtin.fail:
        msg: This playbook is not compatible with your distribution.
      when: >
        (ansible_facts["distribution"] != "Fedora" or ansible_facts['distribution_major_version'] != "44")

    - name: Change the hostname if it's given
      become: true
      ansible.builtin.hostname:
        name: "{{ hostname }}"
        use: systemd
      when: hostname is defined

  tasks:

  roles:
    - role: base
      tags:
        - base

    - role: neovim
      tags:
        - neovim

    - role: ssh
      tags:
        - ssh

    - role: git
      tags:
        - git

    - role: tailscale
      tags:
        - tailscale

    - role: flatpak
      tags:
        - flatpak

    - role: gnome
      tags:
        - gnome
        - never

    - role: nvidia
      tags:
        - nvidia
        - never
